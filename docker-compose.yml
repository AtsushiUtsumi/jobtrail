name: jobtrail

services:
  db:
    container_name: db
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobtrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobtrail}
      POSTGRES_DB: ${POSTGRES_DB:-jobtrail}
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    container_name: backend
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobtrail}:${POSTGRES_PASSWORD:-jobtrail}@db:5432/${POSTGRES_DB:-jobtrail}
      MAX_RAW_TEXT_CHARS: ${MAX_RAW_TEXT_CHARS:-50000}
      UPCOMING_DAYS: ${UPCOMING_DAYS:-7}
      STALE_WAITING_DAYS: ${STALE_WAITING_DAYS:-7}
      STALE_SOURCE_DAYS: ${STALE_SOURCE_DAYS:-90}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u; u.urlopen('http://localhost:8000/api/health', timeout=3)
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

  frontend:
    container_name: frontend
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 20
