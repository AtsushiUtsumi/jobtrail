[project]
name = "jobtrail"
version = "0.1.0"
description = "転職活動管理アプリ（REST + MCP）"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "mcp>=2.3,<3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0,<2.2",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobtrail"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["jobtrail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.importlinter]
root_package = "jobtrail"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain は外部ライブラリと他層に依存しない"
type = "forbidden"
source_modules = ["jobtrail.domain"]
forbidden_modules = [
    "jobtrail.usecase",
    "jobtrail.schemas",
    "jobtrail.infra",
    "jobtrail.adapters",
    "jobtrail.config",
    "jobtrail.bootstrap",
    "fastapi",
    "mcp",
    "pydantic",
    "sqlalchemy",
    "alembic",
]

[[tool.importlinter.contracts]]
name = "usecase は adapters / infra に依存しない"
type = "forbidden"
source_modules = ["jobtrail.usecase", "jobtrail.schemas"]
forbidden_modules = [
    "jobtrail.adapters",
    "jobtrail.infra",
    "jobtrail.bootstrap",
    "fastapi",
    "mcp",
    "sqlalchemy",
]

[[tool.importlinter.contracts]]
name = "infra は usecase / adapters に依存しない"
type = "forbidden"
source_modules = ["jobtrail.infra"]
forbidden_modules = ["jobtrail.usecase", "jobtrail.schemas", "jobtrail.adapters"]
